<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoAlign POC Diagnostics</title>
<style>
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background:#0e1116; color:#e6edf3; }
  h1 { font-size: 18px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid #21262d; }
  .k { color:#8b949e; } .v { font-family: ui-monospace, monospace; text-align:right; word-break:break-all; }
  .pass { color:#3fb950; } .warn { color:#d29922; } .fail { color:#f85149; }
  h2 { font-size:14px; margin:18px 0 4px; color:#58a6ff; }
</style>
</head>
<body>
<h1>GeoAlign POC — live environment</h1>
<div id="out"></div>
<script>
// Runs as a normal page script — it must observe the ALREADY-installed virtual environment.
var out = document.getElementById('out');
function section(t){ var h=document.createElement('h2'); h.textContent=t; out.appendChild(h); }
function row(k,v,cls){
  var d=document.createElement('div'); d.className='row';
  var a=document.createElement('span'); a.className='k'; a.textContent=k;
  var b=document.createElement('span'); b.className='v '+(cls||''); b.textContent=v;
  d.appendChild(a); d.appendChild(b); out.appendChild(d);
}

section('Injection (POC 1)');
var g = window.__GEOALIGN__;
row('Document-start bundle installed', g ? 'yes' : 'NO', g ? 'pass':'fail');

section('Virtual location (POC 1/2)');
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(function(p){
    row('latitude', p.coords.latitude, 'pass');
    row('longitude', p.coords.longitude, 'pass');
    row('accuracy (m)', p.coords.accuracy);
    row('speed', String(p.coords.speed));
    row('heading', String(p.coords.heading));
  }, function(err){ row('geolocation error', err.code+' '+err.message, 'warn'); });
} else {
  row('navigator.geolocation', 'absent', 'warn');
}

section('Regional signals (POC 3)');
row('Intl timeZone', Intl.DateTimeFormat().resolvedOptions().timeZone);
row('getTimezoneOffset (min)', new Date().getTimezoneOffset());
row('local date', new Date().toString());
row('navigator.language', navigator.language);
row('navigator.languages', JSON.stringify(navigator.languages));

section('Browser identity (POC 4)');
row('navigator.userAgent', navigator.userAgent);
row('navigator.platform', navigator.platform || '(hidden)');
row('viewport', window.innerWidth+'x'+window.innerHeight);
row('devicePixelRatio', window.devicePixelRatio);
row('maxTouchPoints', navigator.maxTouchPoints);
if (navigator.userAgentData) {
  row('uaData.mobile', String(navigator.userAgentData.mobile));
  row('uaData.platform', navigator.userAgentData.platform);
}

section('Local-network blocking (POC 5)');
// CAVEAT: loaded from a file:// origin, so these fetches are also subject to CORS/opaque-origin
// rules — a "blocked" here is indicative, not proof. A controlled https:// test page (planned)
// asserts on the X-GeoAlign-Blocked header for a definitive result. Treat this as a smoke test.
function probe(label, url){
  fetch(url, {mode:'no-cors'}).then(function(){
    row(label, 'reached (review under https)', 'warn');
  }).catch(function(){
    row(label, 'blocked/error', 'pass');
  });
}
probe('fetch http://127.0.0.1', 'http://127.0.0.1/');
probe('fetch http://192.168.0.1', 'http://192.168.0.1/');
probe('fetch http://10.0.0.1', 'http://10.0.0.1/');
probe('fetch http://[::1]', 'http://[::1]/');
probe('fetch dword 2130706433', 'http://2130706433/');   // = 127.0.0.1
// WebSocket is NOT interceptable from an app-level WebView (documented limitation). We probe a
// routable private host, not a closed port, so a real connection would actually show.
(function(){
  try {
    var ws = new WebSocket('ws://192.168.0.1:80/');
    var settled = false;
    ws.onerror = function(){ if(!settled){settled=true; row('ws://192.168.0.1 (uninterceptable)', 'error/refused', 'warn');} };
    ws.onopen = function(){ if(!settled){settled=true; row('ws://192.168.0.1 (uninterceptable)', 'CONNECTED — LAN reachable', 'fail'); ws.close();} };
    setTimeout(function(){ if(!settled){settled=true; row('ws://192.168.0.1 (uninterceptable)', 'no connection', 'warn');} }, 3000);
  } catch(e){ row('ws://192.168.0.1 (uninterceptable)', 'blocked', 'pass'); }
})();

section('Capture permissions (POC 6)');
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  navigator.mediaDevices.getUserMedia({audio:true, video:true}).then(function(s){
    row('getUserMedia(cam+mic)', 'GRANTED (leak!)', 'fail');
    s.getTracks().forEach(function(t){ t.stop(); });
  }).catch(function(){ row('getUserMedia(cam+mic)', 'denied', 'pass'); });
} else {
  row('getUserMedia', 'unavailable', 'pass');
}

section('WebRTC ICE (POC 6)');
try {
  var pc = new RTCPeerConnection({iceServers:[]});
  pc.createDataChannel('x');
  var found = [];
  pc.onicecandidate = function(e){
    if (e.candidate) { found.push(e.candidate.candidate); }
    else {
      row('ICE candidates seen', String(found.length), found.length?'warn':'pass');
      // Flag any candidate exposing a private/host address.
      var leaky = found.filter(function(c){ return /192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.|127\.|fe80|::1/.test(c); });
      row('private-address candidates', String(leaky.length), leaky.length?'fail':'pass');
    }
  };
  pc.createOffer().then(function(o){ return pc.setLocalDescription(o); });
} catch(e){ row('WebRTC', 'unavailable/blocked', 'pass'); }

section('Storage isolation (POC 7, informational)');
try {
  document.cookie = 'geoalign_poc=1; path=/';
  localStorage.setItem('geoalign_poc', String(Date.now()));
  row('cookie set', document.cookie.indexOf('geoalign_poc') >= 0 ? 'yes' : 'no');
  row('localStorage set', localStorage.getItem('geoalign_poc') ? 'yes' : 'no');
  row('note', 'Clear-session must wipe these; verify after toggling', 'warn');
} catch(e){ row('storage', 'unavailable', 'warn'); }
</script>
</body>
</html>
